name: 自动生成配置文件

on:
    push:
        branches: [master, main]

jobs:
    build:
        permissions: # Job-level permissions configuration starts here
            contents: write # 'write' access to repository contents
            pull-requests: write # 'write' access to pull requests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: 安装 sing-box
              run: |
                  TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
                  VER=${TAG#v}
                  curl -sLO "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${VER}-linux-amd64.tar.gz"
                  tar -xzf "sing-box-${VER}-linux-amd64.tar.gz"
                  sudo mv "sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/
                  rm -rf "sing-box-${VER}-linux-amd64"*
                  sing-box version
            - name: 自动生成配置文件
              run: |
                  pip3 install -r requirements.txt
                  python3 generate.py
                  python3 generate_rule.py
            - name: 提交更改
              run: |
                  git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add .
                  git commit -m "自动生成配置文件" -a
            - name: 推送更改
              run: |
                  git push
